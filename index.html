<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
  <title>Zagadka 5</title>
</head>
  
<body>
  
<h1>Zagadka 5</h1>
    
<p>Podaj imię postaci.</p>
    
<input type="text" id="odpowiedz" placeholder="Wpisz odpowiedż">
<button onclick="sprawdz()">Sprawdź</button>
  
<p id="wynik"></p>

<script>
function sprawdz() {
  let odp = document.getElementById("odpowiedz")
    .value
    .toLowerCase()
    .replace(/\./g, "")   // usuwa kropki
    .trim();

  let poprawneOdpowiedzi = [
    "albusa dumbledore'a",
    "albus dumbledore",
    "profesor dumbledore",
    "profesor albus dumbledore"
  ];

  if (poprawneOdpowiedzi.includes(odp)) {
    document.getElementById("wynik").innerHTML = 
      "<p>Dobra odpowiedź!!</p>" +
      "<p>Podążaj mapą do miejsca na zdjęciu. Tam znajdź kolejną zagadkę i przepowiednię.</p>" +
      '<img src="most.png" width="300" style="border:4px solid gold;"><br><br>' +
      '<img src="map6domost.JPG" width="300" style="border:4px solid gold;">';
  }

  else {

    document.getElementById("wynik").innerHTML = 
      "WOMP WOMP <br><br>" +
      "Niepoprawna odpowiedź! Spróbuj jeszcze raz!";

  }
  
}
</script>
  
</body>
</html>
